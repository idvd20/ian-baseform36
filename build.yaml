include:
  # Reset image (utility)
  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: _reset

  # Right peripheral (shared by duo and trio)
  - board: nice_nano_v2
    shield: baseform_any_right_peripheral
    artifact-name: any_right_peripheral

  # ============================================================
  # MIRYOKU-COLEMAKDH (Colemak Mod-DH with FLIP + INVERTEDT)
  # ============================================================
  - board: nice_nano_v2
    shield: baseform_duo_left_central
    snippet: studio-rpc-usb-uart
    cmake-args: -DZMK_CONFIG=/tmp/zmk-config/config/miryoku-colemakdh
    artifact-name: miryoku-colemakdh_duo_split_left

  - board: nice_nano_v2
    shield: "baseform_trio_base_central dongle_display"
    snippet: studio-rpc-usb-uart
    cmake-args: -DZMK_CONFIG=/tmp/zmk-config/config/miryoku-colemakdh
    artifact-name: miryoku-colemakdh_trio_split_central

  - board: nice_nano_v2
    shield: baseform_trio_left_peripheral
    artifact-name: miryoku-colemakdh_trio_split_left
